<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tempo benchmark harness</title>
<link rel="stylesheet" href="../demo/vendor/uPlot.min.css">
<style>
	body { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; background: #faf6ef; color: #241f1b; margin: 0; padding: 16px; }
	#plot { width: 1002px; height: 360px; }
	h1 { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #8a7f74; font-weight: 600; margin: 0 0 12px; }
	pre { background: #fffdf8; border: 1px solid #e4dccd; padding: 12px; border-radius: 4px; font-size: 12px; overflow: auto; }
</style>
</head>
<body>
<h1>benchmark harness — driven by scripts/bench.mjs</h1>
<div id="plot"></div>
<pre id="log">waiting…</pre>

<script src="../demo/vendor/tempo.iife.min.js"></script>
<script src="../demo/data.js"></script>
<script>
/**
 * bench harness — runs in a real browser via CDP.
 *
 * Every number here comes from `performance.now()` inside the page. Frame
 * cadence is measured on `requestAnimationFrame`, which is the only honest
 * proxy for "does the animation stutter": a synchronous canvas call can take
 * 0.1 ms while the compositor still drops frames.
 */
(function () {
	'use strict';

	const T = window.Tempo;
	const D = window.TempoData;
	const plotEl = document.getElementById('plot');
	const logEl = document.getElementById('log');

	const wait = ms => new Promise(r => setTimeout(r, ms));

	function stats(samples) {
		if (!samples.length) return { n: 0 };
		const s = samples.slice().sort((a, b) => a - b);
		const at = p => s[Math.min(s.length - 1, Math.max(0, Math.ceil((p / 100) * s.length) - 1))];
		let sum = 0;
		for (const v of s) sum += v;
		return {
			n: s.length,
			min: +s[0].toFixed(4),
			p50: +at(50).toFixed(4),
			p95: +at(95).toFixed(4),
			p99: +at(99).toFixed(4),
			max: +s[s.length - 1].toFixed(4),
			mean: +(sum / s.length).toFixed(4),
		};
	}

	/** Record rAF cadence for `duration` ms while `tick` runs each frame. */
	function measureFrames(duration, tick) {
		return new Promise(resolve => {
			const deltas = [];
			const costs = [];
			let last = null;
			const t0 = performance.now();

			function frame(now) {
				if (last != null) deltas.push(now - last);
				last = now;

				const c0 = performance.now();
				if (tick) tick((now - t0) / duration);
				costs.push(performance.now() - c0);

				if (now - t0 < duration) requestAnimationFrame(frame);
				else resolve({ deltas, costs, duration: performance.now() - t0 });
			}

			requestAnimationFrame(frame);
		});
	}

	function summarizeFrames(res) {
		const d = stats(res.deltas);
		const c = stats(res.costs);
		return {
			wallMs: +res.duration.toFixed(1),
			frames: res.deltas.length,
			fpsMean: +(1000 / d.mean).toFixed(1),
			intervalP50: d.p50,
			intervalP95: d.p95,
			intervalMax: d.max,
			frameCostP50: c.p50,
			frameCostP95: c.p95,
			frameCostMax: c.max,
			droppedOver20ms: res.deltas.filter(v => v > 20).length,
		};
	}

	/**
	 * Pixel-space fidelity.
	 *
	 * Comparing values at every original x punishes decimation for detail the
	 * screen cannot show: at 1002 px wide, 417 samples share one column. What a
	 * reader can actually see is the per-column envelope, so this measures the
	 * largest vertical disagreement, in CSS pixels, between the raw series'
	 * column envelope and the decimated polyline's column envelope.
	 *
	 * A result below ~1 px means the two renders are indistinguishable at that
	 * width — which is the claim worth making.
	 */
	function pixelFidelity(xs, ys, indices, width, height) {
		const n = xs.length;
		if (!n) return null;

		let yMin = Infinity;
		let yMax = -Infinity;
		for (let i = 0; i < n; i++) {
			const v = ys[i];
			if (v == null) continue;
			if (v < yMin) yMin = v;
			if (v > yMax) yMax = v;
		}
		const span = (yMax - yMin) || 1;
		const x0 = xs[0];
		const xSpan = (xs[n - 1] - x0) || 1;
		const dx = xSpan / width;
		const colOf = x => Math.min(width - 1, Math.max(0, Math.floor((x - x0) / dx)));

		const rawMin = new Float64Array(width).fill(Infinity);
		const rawMax = new Float64Array(width).fill(-Infinity);

		for (let i = 0; i < n; i++) {
			const v = ys[i];
			if (v == null) continue;
			const c = colOf(xs[i]);
			if (v < rawMin[c]) rawMin[c] = v;
			if (v > rawMax[c]) rawMax[c] = v;
		}

		// The decimated envelope has to follow the drawn polyline: for every
		// segment, walk the columns it crosses and interpolate y at each column
		// boundary. Counting only the retained vertices would overstate the
		// error, because a straight segment covers a whole span of columns.
		const decMin = new Float64Array(width).fill(Infinity);
		const decMax = new Float64Array(width).fill(-Infinity);

		for (let k = 0; k + 1 < indices.length; k++) {
			const ia = indices[k];
			const ib = indices[k + 1];
			const xa = xs[ia];
			const xb = xs[ib];
			const ya = ys[ia];
			const yb = ys[ib];
			if (ya == null || yb == null || xb === xa) continue;

			const cFrom = colOf(xa);
			const cTo = colOf(xb);
			const slope = (yb - ya) / (xb - xa);

			for (let c = cFrom; c <= cTo; c++) {
				const lo = Math.max(xa, x0 + c * dx);
				const hi = Math.min(xb, x0 + (c + 1) * dx);
				if (hi < lo) continue;
				const yl = ya + slope * (lo - xa);
				const yh = ya + slope * (hi - xa);
				const loV = Math.min(yl, yh);
				const hiV = Math.max(yl, yh);
				if (loV < decMin[c]) decMin[c] = loV;
				if (hiV > decMax[c]) decMax[c] = hiV;
			}
		}

		let maxDiffPx = 0;
		let worstCol = -1;
		let sumDiffPx = 0;
		let cols = 0;

		for (let c = 0; c < width; c++) {
			if (rawMin[c] === Infinity || decMin[c] === Infinity) continue;
			const dLo = Math.abs(rawMin[c] - decMin[c]);
			const dHi = Math.abs(rawMax[c] - decMax[c]);
			const d = Math.max(dLo, dHi) / span * height;
			sumDiffPx += d;
			cols++;
			if (d > maxDiffPx) {
				maxDiffPx = d;
				worstCol = c;
			}
		}

		return {
			width,
			height,
			maxDiffPx: +maxDiffPx.toFixed(2),
			meanDiffPx: cols ? +(sumDiffPx / cols).toFixed(2) : null,
			worstCol,
			columnsCompared: cols,
		};
	}

	function mount(data, opts) {
		plotEl.innerHTML = '';
		const el = document.createElement('div');
		el.style.width = '1002px';
		plotEl.appendChild(el);
		return new T.TempoChart(el, Object.assign({
			data: data,
			width: 1002,
			height: 360,
			series: [
				{ label: 'A', stroke: '#c2740f', width: 1.4 },
				{ label: 'B', stroke: '#3f6f6a', width: 1.2 },
			],
			transitionDuration: 0,
		}, opts || {}));
	}

	window.runBench = async function (opts) {
		opts = opts || {};
		const scales = opts.scales || [1000, 10000, 100000, 500000, 1000000];
		const reps = opts.reps || 12;
		const mode = opts.mode || 'lttb';
		const log = [];
		const say = m => { log.push(m); logEl.textContent = log.join('\n'); };

		const out = {
			meta: {
				ua: navigator.userAgent,
				dpr: window.devicePixelRatio,
				cores: navigator.hardwareConcurrency,
				heapLimitMB: performance.memory ? Math.round(performance.memory.jsHeapSizeLimit / 1048576) : null,
				at: new Date().toISOString(),
			},
			pipeline: {},
			transitions: {},
			replay: {},
			live: {},
			fidelity: {},
		};

		// ---- 1. pipeline cost by scale -------------------------------------
		for (const n of scales) {
			say('pipeline ' + n);
			const raw = D.bigSeries(n);

			const sanitizeMs = [];
			const decimateMs = [];
			let last;

			for (let r = 0; r < reps; r++) {
				let t = performance.now();
				last = T.sanitize(raw);
				sanitizeMs.push(performance.now() - t);

				t = performance.now();
				T.decimateAligned(last.data, 2400, mode);
				decimateMs.push(performance.now() - t);
			}

			// Cold construction + first paint, measured once per scale.
			const t0 = performance.now();
			const chart = mount(raw, { maxPoints: 2400, decimation: mode });
			const mountMs = performance.now() - t0;

			// Warm setData with a same-length payload (the transition path).
			const alt = [raw[0], raw[1].map(v => v * 0.9), raw[2].map(v => v * 1.1)];
			const setDataMs = [];
			for (let r = 0; r < Math.min(reps, 8); r++) {
				const t = performance.now();
				chart.setData(alt, { animate: false });
				setDataMs.push(performance.now() - t);
			}

			const st = chart.getStats();
			out.pipeline[n] = {
				rows: st.rows,
				rendered: st.rendered,
				budget: st.budget,
				sanitize: stats(sanitizeMs),
				decimate: stats(decimateMs),
				mountMs: +mountMs.toFixed(2),
				setData: stats(setDataMs),
				renderP50: st.metrics['render.ms'] ? +st.metrics['render.ms'].p50.toFixed(4) : null,
				renderMax: st.metrics['render.ms'] ? +st.metrics['render.ms'].max.toFixed(4) : null,
				sanitizeReportP50: st.metrics['sanitize.ms'] ? +st.metrics['sanitize.ms'].p50.toFixed(4) : null,
			};

			chart.destroy();
			await wait(30);
		}

		// ---- 2. transition frame cadence ------------------------------------
		{
			say('transition');
			const n = 20000;
			const raw = D.bigSeries(n);
			const chart = mount(raw, { maxPoints: 2400, transitionDuration: 320, transitionEasing: 'cubicInOut' });
			const alt = [raw[0], raw[1].map(v => 100 - v), raw[2].map(v => v * 0.5 + 25)];

			// Warm up, then measure two transitions back to back.
			chart.setData(alt, { animate: true });
			await wait(420);

			const modes = new Set();
			const res = await measureFrames(700, progress => {
				if (chart.transition.active) modes.add(chart.transition.mode);
				if (progress > 0.02 && progress < 0.06) chart.setData(raw, { animate: true });
				if (progress > 0.36 && progress < 0.40) chart.setData(alt, { animate: true });
			});

			out.transitions = Object.assign(summarizeFrames(res), {
				payloadPoints: chart.view ? chart.view[0].length : 0,
				modesSeen: [...modes],
				framesRendered: chart.getStats().transition.frames,
			});

			chart.destroy();
			await wait(30);
		}

		// ---- 3. replay frame cadence ----------------------------------------
		for (const scale of [20000, 1000000]) {
			say('replay ' + scale);
			const raw = D.bigSeries(scale);
			const chart = mount(raw, { maxPoints: 2400 });
			chart.setSpeed(4);
			chart.play();

			const res = await measureFrames(1500, () => {});
			const st = chart.getStats();
			out.replay[scale] = Object.assign(summarizeFrames(res), {
				rows: st.rows,
				rendered: st.rendered,
				renderMsP50: st.metrics['render.ms'] ? +st.metrics['render.ms'].p50.toFixed(4) : null,
				renderMsP95: st.metrics['render.ms'] ? +st.metrics['render.ms'].p95.toFixed(4) : null,
				renderMsMax: st.metrics['render.ms'] ? +st.metrics['render.ms'].max.toFixed(4) : null,
				renderSamples: st.metrics['render.ms'] ? st.metrics['render.ms'].n : 0,
			});

			chart.destroy();
			await wait(30);
		}

		// ---- 4. live coalescing --------------------------------------------
		{
			say('live');
			const chart = mount([[], []], { maxPoints: 2400 });
			chart.startStream({ capacity: 2000 });

			let t = Date.UTC(2026, 9, 22, 12, 0, 0);
			let pushed = 0;

			const res = await measureFrames(1500, () => {
				// 600 rows/s at ~60 fps ≈ 10 rows per frame
				for (let i = 0; i < 10; i++) {
					t += 100;
					chart.push([t, 50 + Math.sin(pushed / 20) * 20 + (pushed % 7)]);
					pushed++;
				}
			});

			const s = chart.streamStats;
			out.live = Object.assign(summarizeFrames(res), {
				pushed,
				requests: s.requests,
				flushes: s.flushes,
				coalesced: s.coalesced,
				coalesceRatio: s.requests ? +(s.flushes / s.requests).toFixed(3) : null,
				window: s.size,
			});

			chart.destroy();
			await wait(30);
		}

		// ---- 5. fidelity across decimation modes ----------------------------
		{
			say('fidelity');
			const n = 1000000;
			const raw = D.bigSeries(n);

			for (const m of ['lttb', 'minmax', 'none']) {
				const t0 = performance.now();
				const idx = T.selectIndices(raw[0], raw[1], 2400, m === 'none' ? 'lttb' : m);
				const selMs = performance.now() - t0;
				const fid = T.measureFidelity(raw[0], raw[1], idx);
				const px = pixelFidelity(raw[0], raw[1], idx, 1002, 360);

				out.fidelity[m] = {
					kept: fid.kept,
					selectMs: +selMs.toFixed(2),
					maxNormError: +fid.maxNormError.toFixed(6),
					meanNormError: +(fid.meanAbsError / fid.ySpan).toFixed(6),
					peakLossRatio: +fid.peakLossRatio.toFixed(8),
					ySpan: +fid.ySpan.toFixed(2),
					pixel: px,
					note: m === 'none' ? 'index list still LTTB; "none" only skips decimation in the chart' : 'measured against the raw series',
				};
			}
		}

		say('done');
		return out;
	};
})();
</script>
</body>
</html>
